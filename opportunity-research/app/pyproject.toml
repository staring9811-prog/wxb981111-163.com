[project]
name = "oppo"
version = "1.0.0"
description = "品类机会判定台（第一期 · 亚马逊美国 · 浴室柜）"
requires-python = ">=3.14,<3.15"
dependencies = [
    "fastapi==0.162.0",
    "uvicorn==0.54.0",
    "python-multipart==0.0.32",
    "jinja2==3.1.6",
    "sqlalchemy==2.1.6",
    "alembic==1.20.1",
    "pandas==3.0.6",
    "numpy==2.5.4",
    "scipy==1.18.1",
    "statsmodels==0.15.0",
    "openpyxl==3.1.5",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "playwright==1.64.1",
    "ruff==0.14.0",
]

[project.scripts]
oppo = "oppo.cli:main"

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["oppo*"]

[tool.setuptools.package-data]
oppo = ["web/templates/**/*", "web/static/**/*", "web/report/**/*", "migrations/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py314"
extend-exclude = ["oppo/migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]
ignore = ["E501"]
